<head>
<meta charset="utf-8">

<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Caderno">
<meta name="theme-color" content="#f9fafc">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500&family=Indie+Flower&family=Shadows+Into+Light+Two&family=Figtree:wght@400;500;600;700&family=Lora:wght@400;500&family=Patrick+Hand&family=Young+Serif&display=swap">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<style>
/* Layout: biblioteca de capas em grade; editor em tela cheia com mesa, páginas em coluna e estojo flutuante embaixo */
:root{
  --bg:#eceef3; --surface:#f9fafc; --desk:#dfe3ea; --ink:#1a1e29; --muted:#5c6476; --line:#d3d8e2;
  --accent:#2343a8; --accent-soft:#dfe5f8; --accent-ink:#ffffff; --danger:#b3261e; --ok:#2b7a4b;
  --shadow:0 1px 2px rgba(20,28,50,.08),0 8px 24px rgba(20,28,50,.10);
  --f-display:"Young Serif",Georgia,"Times New Roman",serif;
  --f-ui:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12151c; --surface:#1b1f29; --desk:#0d1016; --ink:#e7e9ef; --muted:#9ca3b3; --line:#2c3241;
  --accent:#8ea4ff; --accent-soft:#232c4a; --accent-ink:#0b0f1e; --danger:#ff8a80; --ok:#7fd3a0;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.45); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#12151c; --surface:#1b1f29; --desk:#0d1016; --ink:#e7e9ef; --muted:#9ca3b3; --line:#2c3241;
  --accent:#8ea4ff; --accent-soft:#232c4a; --accent-ink:#0b0f1e; --danger:#ff8a80; --ok:#7fd3a0;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.45); color-scheme:dark }

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input{font:inherit;color:inherit}
svg{display:block}

/* ---------- Biblioteca ---------- */
#library{max-width:1080px;margin:0 auto;padding-block:28px 64px}
.lib-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;margin-bottom:28px}
.lib-head h1{font-family:var(--f-display);font-weight:400;font-size:clamp(30px,5vw,44px);line-height:1.05;margin:0;text-wrap:balance}
.lib-head p{margin:6px 0 0;color:var(--muted);max-width:52ch}
.where{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);background:var(--surface);
  border:1px solid var(--line);border-radius:999px;padding:5px 12px}
.where i{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.where.local i{background:#d39a22}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:28px 22px}
.book{display:flex;flex-direction:column;gap:10px;min-width:0}
.cover{position:relative;aspect-ratio:3/4;max-width:100%;border:0;border-radius:4px 12px 12px 4px;padding:0;
  background:var(--c);box-shadow:var(--shadow);overflow:hidden;transition:transform .18s ease}
.cover:hover{transform:translateY(-3px)}
.cover::before{content:"";position:absolute;inset:0 auto 0 0;width:12px;background:rgba(0,0,0,.22)}
.cover::after{content:"";position:absolute;top:0;bottom:0;right:16%;width:7px;background:rgba(0,0,0,.28)}
.cover .label{position:absolute;left:18%;right:26%;top:18%;background:#f7f4ea;color:#1d1f26;border-radius:3px;
  padding:8px 8px 9px;font-family:var(--f-display);font-size:14px;line-height:1.2;text-align:left;
  box-shadow:0 1px 0 rgba(0,0,0,.15);overflow-wrap:anywhere;max-height:56%;overflow:hidden}
.cover .label small{display:block;font-family:var(--f-ui);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:#6a6658;margin-top:6px}
.book-meta{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.book-meta b{display:block;font-weight:600;font-size:14.5px;line-height:1.3;overflow-wrap:anywhere}
.book-meta span{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.icon-btn{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:10px;border:0;background:transparent;color:var(--ink);flex:none}
.icon-btn:hover{background:var(--accent-soft)}
.icon-btn[disabled]{opacity:.35;cursor:default;background:transparent}
.new-book{aspect-ratio:3/4;max-width:100%;border:2px dashed var(--line);border-radius:4px 12px 12px 4px;background:transparent;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--muted);font-weight:600}
.new-book:hover{border-color:var(--accent);color:var(--accent)}
.new-book span.plus{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink)}
.lib-state{color:var(--muted);padding:40px 0}
.lib-tools{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.lib-tools .btn{padding:6px 14px;font-size:14px}

/* ---------- Editor ---------- */
#editor{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;position:fixed;inset:0;z-index:5;background:var(--desk);display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:6px;background:var(--surface);border-bottom:1px solid var(--line);
  padding-top:calc(8px + env(safe-area-inset-top,0px));padding-bottom:8px;
  padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px))}
.title-in{flex:1;min-width:0;border:1px solid transparent;background:transparent;border-radius:8px;padding:6px 8px;
  font-family:var(--f-display);font-size:19px;text-overflow:ellipsis}
.title-in:hover{border-color:var(--line)}
.status{font-size:12.5px;color:var(--muted);white-space:nowrap;padding:0 4px}
.status.err{color:var(--danger);font-weight:600}
.zoom{display:flex;align-items:center;gap:2px}
.zoom output{min-width:44px;text-align:center;font-size:13px;font-variant-numeric:tabular-nums;color:var(--muted)}
@media (max-width:520px){.status{display:none}.zoom output{display:none}.title-in{font-size:17px}}
#scroller{flex:1;overflow:auto;position:relative;overscroll-behavior:contain}
#scroller{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#pages{transform-origin:0 0;will-change:auto}
#pages{display:flex;flex-direction:column;align-items:center;gap:22px;padding:22px 16px 140px;min-width:min-content}
.page{position:relative;background:#fff;box-shadow:var(--shadow);border-radius:2px;flex:none}
.page canvas{position:absolute;inset:0;width:100%;height:100%}
.page .pnum{position:absolute;right:0;bottom:-20px;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.add-page{border:2px dashed var(--line);background:transparent;border-radius:10px;padding:14px 22px;color:var(--muted);font-weight:600;display:flex;gap:8px;align-items:center}
.add-page:hover{border-color:var(--accent);color:var(--accent)}
.pchip{position:absolute;top:10px;right:max(12px,env(safe-area-inset-right,0px));z-index:3;background:var(--surface);color:var(--muted);
  border:1px solid var(--line);border-radius:999px;padding:3px 11px;font-size:12.5px;font-variant-numeric:tabular-nums;pointer-events:none}
.tray-wrap{position:absolute;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;
  padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));pointer-events:none;z-index:4}
.tray{pointer-events:auto;display:flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--line);
  border-radius:16px;box-shadow:var(--shadow);padding:6px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.tray::-webkit-scrollbar{display:none}
.tray .sep{width:1px;align-self:stretch;background:var(--line);margin:4px 4px;flex:none}
.tool{width:42px;height:42px;border-radius:11px;border:0;background:transparent;display:grid;place-items:center;flex:none;color:var(--ink)}
.tool:hover{background:var(--accent-soft)}
.tool[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.tool[disabled]{opacity:.35;cursor:default;background:transparent}
.swatch{width:30px;height:30px;border-radius:50%;border:0;flex:none;background:var(--sw);margin:0 2px;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.18)}
.swatch[aria-pressed="true"]{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--accent)}
.wbtn{width:34px;height:42px;border:0;background:transparent;border-radius:10px;display:grid;place-items:center;flex:none}
.wbtn i{display:block;border-radius:50%;background:var(--ink)}
.wbtn[aria-pressed="true"]{background:var(--accent-soft)}
.wbtn[aria-pressed="true"] i{background:var(--accent)}


.penbtn{position:relative}
.penbtn .pbar{position:absolute;left:10px;right:10px;bottom:4px;border-radius:2px;background:var(--pc);opacity:var(--po,1);box-shadow:0 0 0 1px rgba(127,127,127,.35)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:7px 12px 7px 9px;display:inline-flex;gap:6px;align-items:center;font-size:14px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.range{display:flex;align-items:center;gap:12px}
.range input{flex:1;accent-color:var(--accent);min-width:0}
.range output{min-width:52px;text-align:right;font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px}
.hint{display:block;color:var(--muted);font-size:13px;line-height:1.4;margin-top:-2px}
.preview{width:100%;height:110px;border-radius:10px;box-shadow:inset 0 0 0 1px var(--line);display:block}
.copt.custom{position:relative;overflow:hidden;background:conic-gradient(#e33,#ec3,#3c5,#3cd,#36e,#c3c,#e33)}
.copt.custom input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;border:0;padding:0}
.opts.sm{gap:8px}.opts.sm .copt{width:32px;height:32px;border-radius:50%}


.tlayer{position:absolute;left:0;top:0;width:1000px;height:1414px;transform-origin:0 0;pointer-events:none}
.tbox,.tedit{position:absolute;margin:0;padding:0;border:0;line-height:1.25;white-space:pre-wrap;overflow-wrap:break-word;background:transparent}
.tedit{pointer-events:auto;resize:none;overflow:hidden;outline:2px solid var(--accent);outline-offset:4px;border-radius:2px;touch-action:auto;-webkit-user-select:text;user-select:text;caret-color:#2343a8}
#scroller.texttool .tbox{pointer-events:auto;cursor:text;outline:1px dashed rgba(35,67,168,.45);outline-offset:4px}
#scroller.texttool .page{cursor:text}
.hwrchip{position:absolute;top:10px;left:max(12px,env(safe-area-inset-left,0px));z-index:3;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:3px 12px;font-size:12.5px;font-weight:600}
.textbar-wrap{position:absolute;left:0;right:0;bottom:calc(76px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;pointer-events:none;z-index:5;
  padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px))}
.textbar{pointer-events:auto;display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:6px 8px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.textbar::-webkit-scrollbar{display:none}
.textbar .chip{white-space:nowrap;padding:6px 11px}
.textbar .sep{width:1px;align-self:stretch;background:var(--line);margin:4px 2px;flex:none}
.textbar .tool{width:36px;height:36px}
.textbar .btn{white-space:nowrap;padding:8px 12px}
.textbar .fsval{min-width:26px;text-align:center;font-variant-numeric:tabular-nums;font-size:14px;color:var(--muted)}
.selbox{position:absolute;z-index:2;border:1.5px dashed var(--accent);border-radius:6px;background:rgba(35,67,168,.05);pointer-events:none;will-change:transform}
.selbox .selimg{position:absolute;inset:0;width:100%;height:100%}
.selh{position:absolute;right:-13px;bottom:-13px;width:26px;height:26px;border-radius:50%;background:var(--accent);border:3px solid var(--surface);box-shadow:var(--shadow);pointer-events:auto;cursor:nwse-resize;touch-action:none}
.selcount{font-size:13px;color:var(--muted);white-space:nowrap;padding:0 4px;font-variant-numeric:tabular-nums}
.tapes{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.page canvas.laser{pointer-events:none}
.subhead{font-family:var(--f-ui);font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--accent);margin:22px 0 12px;padding-top:14px;border-top:1px solid var(--line)}
.tapechip{padding:6px 12px 6px 6px}
.tapechip svg{border-radius:4px;flex:none}
/* iPad e telas largas: barra de ferramentas vertical à direita, como nos apps de caderno */
@media (min-width:700px){
  .tray-wrap{top:52px;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:auto;right:0;align-items:center;padding-left:0;padding-right:max(12px,env(safe-area-inset-right,0px))}
  .tray{flex-direction:column;max-height:100%;overflow-y:auto;overflow-x:hidden;padding:6px}
  .tray .sep{width:auto;height:1px;align-self:stretch;margin:4px 6px}
  .tray .swatch{margin:2px 0}
  #pages{padding-right:104px}
  .pchip{right:auto;left:50%;transform:translateX(-50%)}
}
/* ---------- Menus, modais e avisos ---------- */
.menu{position:fixed;z-index:30;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);
  padding:6px;min-width:220px;display:flex;flex-direction:column}
.menu button{border:0;background:transparent;text-align:left;padding:10px 12px;border-radius:8px;display:flex;gap:10px;align-items:center}
.menu button:hover{background:var(--accent-soft)}
.menu button.danger{color:var(--danger)}
.scrim{position:fixed;inset:0;z-index:40;background:rgba(10,14,24,.45);display:grid;place-items:center;
  padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px))}
.dialog{background:var(--surface);color:var(--ink);border-radius:18px;box-shadow:var(--shadow);width:min(480px,100%);max-height:calc(100% - 20px);overflow:auto;padding:22px}
.dialog h2{font-family:var(--f-display);font-weight:400;font-size:24px;margin:0 0 4px;text-wrap:balance}
.dialog p{margin:0 0 16px;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:8px;margin-bottom:18px}
.field > span{font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.field input[type=text]{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;font-size:16px}
.opts{display:flex;flex-wrap:wrap;gap:10px}
.copt{width:38px;height:38px;border-radius:10px;border:0;background:var(--c);box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.copt[aria-pressed="true"]{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--accent)}
.popt{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:6px 6px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;width:92px}
.popt canvas{width:66px;height:84px;border-radius:3px;box-shadow:0 0 0 1px rgba(0,0,0,.1)}
.popt[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset;color:var(--accent);font-weight:600}
.actions{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:10px;margin-top:6px}
.btn{border:1px solid var(--line);background:transparent;border-radius:10px;padding:10px 16px;font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.left{margin-right:auto;color:var(--danger);border-color:transparent;padding-left:4px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:50;
  background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<link rel="stylesheet" href="features.css">
</head>
<body>

<section id="library" aria-label="Seus cadernos">
  <header class="lib-head">
    <div>
      <h1>Caderno Livre</h1>
      <p>Escreva à mão com caneta, marca-texto e borracha. Funciona no computador, no celular e no tablet.</p>
    </div>
    <div class="lib-tools"><span class="where" id="where" hidden><i></i><span></span></span><button class="btn" id="import-pdf">Importar PDF</button><button class="btn" id="backup-lib">Backup</button><button class="btn" id="pentest-lib">Testar caneta</button></div>
  </header>
  <div class="library-filters" role="search"><label><span>Buscar</span><input id="library-search" type="search" placeholder="Cadernos e textos digitados…"></label><label><span>Pasta</span><select id="library-folder"><option value="">Todas as pastas</option></select></label><button class="btn" id="library-favorites" aria-pressed="false">★ Favoritos</button></div>
  <div id="shelf" class="shelf"><div class="lib-state">Abrindo seus cadernos…</div></div>
</section>

<section id="editor" hidden aria-label="Caderno aberto">
  <div class="topbar">
    <button class="icon-btn" id="back" aria-label="Voltar para os cadernos" title="Voltar"></button>
    <input class="title-in" id="title" type="text" aria-label="Nome do caderno" maxlength="80">
    <span class="status" id="status">Salvo</span>
    <div class="zoom">
      <button class="icon-btn" id="zout" aria-label="Diminuir zoom" title="Diminuir"></button>
      <output id="zval">100%</output>
      <button class="icon-btn" id="zin" aria-label="Aumentar zoom" title="Aumentar"></button>
    </div>
    <button class="icon-btn" id="more" aria-label="Mais opções" title="Mais opções"></button>
  </div>
  <div style="position:relative;flex:1;display:flex;min-height:0">
    <div id="scroller"><div id="pages"></div></div>
    <div class="pchip" id="pchip">Página 1 de 1</div>
    <div class="hwrchip" id="hwrchip" hidden role="status"></div>
    <div class="textbar-wrap"><div class="textbar" id="textbar" hidden role="toolbar" aria-label="Formatar texto"></div><div class="textbar" id="selbar" hidden role="toolbar" aria-label="Seleção"></div></div>
    <div class="tray-wrap"><div class="tray" id="tray" role="toolbar" aria-label="Ferramentas"></div></div>
  </div>
</section>

<section id="writing-focus" hidden aria-label="Janela de escrita ampliada">
  <div class="focus-controls"><b>Escrita ampliada</b><span id="focus-position"></span><label>Ampliação <select id="focus-scale"><option value="2">2×</option><option value="2.8" selected>2,8×</option><option value="4">4×</option></select></label><button class="icon-btn" id="focus-close" aria-label="Fechar escrita ampliada">✕</button></div>
  <div id="focus-surface"><canvas id="focus-paper"></canvas><svg id="focus-ink" preserveAspectRatio="none" aria-hidden="true"></svg><canvas id="focus-text" aria-hidden="true"></canvas><svg id="focus-tapes" preserveAspectRatio="none" aria-hidden="true"></svg></div>
  <div class="focus-controls"><small>Toque na página para escolher onde escrever.</small><button class="btn" data-focus-move="left" aria-label="Região anterior">←</button><button class="btn" data-focus-move="right" aria-label="Próxima região">→</button><button class="btn" data-focus-move="up" aria-label="Subir região">↑</button><button class="btn" data-focus-move="down" aria-label="Descer região">↓</button><button class="btn" data-focus-move="next">Próxima linha ↵</button></div>
</section>
<div id="toast" hidden role="status"></div>

<script src="js/ink.js"></script>
<script src="js/pentest.js"></script>
<script src="js/hwr.js"></script>
<script src="js/app.js"></script>
<script>if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));</script>
</body>
</html>
